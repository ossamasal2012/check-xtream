name: Build Xtream Checker APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check project
        run: |
          test -f index.html
          echo "index.html found"

      - name: Create package.json
        run: |
          printf '%s\n' \
            '{' \
            '  "name": "xtream-checker",' \
            '  "version": "1.0.0",' \
            '  "private": true,' \
            '  "dependencies": {' \
            '    "@capacitor/core": "^7.4.3",' \
            '    "@capacitor/android": "^7.4.3",' \
            '    "@capacitor/cli": "^7.4.3"' \
            '  }' \
            '}' > package.json

      - name: Install dependencies
        run: npm install

      - name: Create Capacitor config
        run: |
          printf '%s\n' \
            '{' \
            '  "appId": "com.ossama.xtreamchecker",' \
            '  "appName": "Xtream Checker",' \
            '  "webDir": "."' \
            '}' > capacitor.config.json

      - name: Create Android project
        run: npx cap add android

      - name: Copy web application
        run: npx cap copy android

      - name: Enable network access
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<manifest ",
                  '<manifest '
                  'xmlns:android="http://schemas.android.com/apk/res/android" '
              )

              text = text.replace(
                  ">",
                  '>\n    <uses-permission android:name="android.permission.INTERNET" />',
                  1
              )

          text = text.replace(
              "<application ",
              '<application android:usesCleartextTraffic="true" '
          )

          path.write_text(text)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find android/app/build/outputs/apk/debug -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xtream-Checker-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
